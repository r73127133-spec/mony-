<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentMoney Application</title>
  
  <!-- Tailwind CSS CDN -->

      darkMode: 'class',

        extend: {

      display: none;
    }
    .no-scrollbar {

  </style>
</head>

  <!-- Main Container -->
  <div id="app" class="min-h-screen flex flex-col justify-between"></div>

  <!-- Transaction Modal Template Container -->
  <div id="modal-container"></div>

  <script>
    // Initial Data Structures
    const INITIAL_TRANSACTIONS = [

      { id: 2, title: 'Campus Dining Meal Plan', amount: 120.00, type: 'expense', category: 'Food & Dining', date: '2026-09-22' },
      { id: 3, title: 'Part-time Tutoring Stipend', amount: 250.00, type: 'income', category: 'Income', date: '2026-09-20' },
      { id: 4, title: 'Monthly Spotify Student Sub', amount: 5.99, type: 'expense', category: 'Entertainment', date: '2026-09-18' },
      { id: 5, title: 'Dorm Laundry Card Refill', amount: 15.00, type: 'expense', category: 'Personal', date: '2026-09-15' },
      { id: 6, title: 'Parent Allowance Transfer', amount: 300.00, type: 'income', category: 'Allowance', date: '2026-09-01' },
      { id: 7, title: 'Campus Coffee Shop', amount: 14.50, type: 'expense', category: 'Food & Dining', date: '2026-09-12' },
      { id: 8, title: 'Bus Pass Monthly Top-up', amount: 25.00, type: 'expense', category: 'Transport', date: '2026-09-10' },
      { id: 9, title: 'Lab Supplies & Safety Goggles', amount: 32.00, type: 'expense', category: 'Books & Supplies', date: '2026-09-08' },
      { id: 10, title: 'Campus Movie Night Ticket', amount: 12.00, type: 'expense', category: 'Entertainment', date: '2026-09-05' }
    ];

    const INITIAL_BUDGETS = [
      { category: 'Food & Dining', allocated: 250, spent: 175, color: '#10B981' },
      { category: 'Books & Supplies', allocated: 150, spent: 116.50, color: '#3B82F6' },
      { category: 'Entertainment', allocated: 60, spent: 42.00, color: '#8B5CF6' },

    const INITIAL_SAVINGS_GOALS = [
      { id: 1, title: 'Spring Break Trip', target: 500, saved: 320, icon: '✈️' },
      { id: 2, title: 'Emergency Fund', target: 1000, saved: 650, icon: '🛡️' },
      { id: 3, title: 'New Student Laptop', target: 900, saved: 450, icon: '💻' }
    ];

    const STUDENT_DEALS = [
      { title: 'Spotify + Hulu Student Bundle', discount: '50% OFF', category: 'Entertainment', provider: 'Spotify' },
      { title: 'GitHub Student Developer Pack', discount: 'FREE Tools', category: 'Software', provider: 'GitHub' },
      { title: 'Campus Transit Pass Discount', discount: '30% OFF', category: 'Transport', provider: 'Metro' },
      { title: 'Adobe Creative Cloud Student', discount: '60% OFF', category: 'Software', provider: 'Adobe' }
    ];

    const MONTHLY_TREND_DATA = [
      { month: 'May', income: 450, expense: 320 },
      { month: 'Jun', income: 520, expense: 380 },
      { month: 'Jul', income: 480, expense: 290 },
      { month: 'Aug', income: 600, expense: 410 },
      { month: 'Sep', income: 550, expense: 367.99 }
    ];

    // Reactive State Store
    const state = {
      user: JSON.parse(localStorage.getItem('student_user')) || null,
      authMode: 'login', // 'login' | 'register'
      authError: '',
      email: '',
      password: '',
      name: '',
      university: 'State University',
      monthlyAllowance: '600',
      showPassword: false,
      darkMode: false,
      activeTab: 'dashboard', // 'dashboard', 'analytics', 'transactions', 'budgets', 'goals', 'discounts'
      transactions: [...INITIAL_TRANSACTIONS],
      budgets: [...INITIAL_BUDGETS],
      goals: [...INITIAL_SAVINGS_GOALS],
      chartType: 'bar', // 'bar' | 'line'
      isAddModalOpen: false,
      isQrModalOpen: false,
      qrMode: 'scan', // 'scan' | 'mycode'
      qrRecipient: 'Campus Dining Hall',
      qrPayAmount: '',
      qrPayNote: '',
      isScanning: false,
      qrSuccess: false,
      myQrRequestAmount: '',
      hoveredCategoryIdx: null,
      activeTrendPoint: null
    };

    function showNotification(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 3000);
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      if (state.darkMode) {
        document.documentElement.classList.add('dark');
        document.body.classList.add('bg-slate-900', 'text-slate-100');
        document.body.classList.remove('bg-slate-50', 'text-slate-800');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('bg-slate-900', 'text-slate-100');
        document.body.classList.add('bg-slate-50', 'text-slate-800');
      }
      render();
    }

    function renderTrendingChart(data, isDark, chartType) {
      const maxVal = Math.max(...data.flatMap(d => [d.income, d.expense])) * 1.15 || 700;
      const svgHeight = 180;
      const svgWidth = 500;
      const paddingX = 40;
      const paddingY = 25;

      const chartInnerWidth = svgWidth - paddingX * 2;
      const chartInnerHeight = svgHeight - paddingY * 2;

      const points = data.map((d, index) => {
        const x = paddingX + (index / (data.length - 1)) * chartInnerWidth;
        const yIncome = svgHeight - paddingY - (d.income / maxVal) * chartInnerHeight;
        const yExpense = svgHeight - paddingY - (d.expense / maxVal) * chartInnerHeight;
        return { x, yIncome, yExpense, ...d };
      });

      let gridLines = [0, 0.33, 0.66, 1].map((ratio) => {
        const y = paddingY + ratio * chartInnerHeight;
        const val = Math.round(maxVal * (1 - ratio));
        return `
          <g>
            <line x1="${paddingX}" y1="${y}" x2="${svgWidth - paddingX}" y2="${y}" stroke="${isDark ? '#334155' : '#E2E8F0'}" stroke-dasharray="4 4" />
            <text x="${paddingX - 8}" y="${y + 4}" text-anchor="end" class="fill-slate-400 text-[9px] font-medium">$${val}</text>
          </g>
        `;
      }).join('');

      let chartContent = '';

      if (chartType === 'bar') {
        chartContent = data.map((d, index) => {
          const groupWidth = chartInnerWidth / data.length;
          const groupX = paddingX + index * groupWidth;
          const barWidth = Math.min(18, groupWidth * 0.35);

          const hIncome = (d.income / maxVal) * chartInnerHeight;
          const yIncome = svgHeight - paddingY - hIncome;

          const hExpense = (d.expense / maxVal) * chartInnerHeight;
          const yExpense = svgHeight - paddingY - hExpense;

          return `
            <g class="cursor-pointer" onclick="setActivePoint(${index})">
              <rect x="${groupX + groupWidth / 2 - barWidth - 2}" y="${yIncome}" width="${barWidth}" height="${hIncome}" rx="4" fill="#10B981" opacity="0.85" />
              <rect x="${groupX + groupWidth / 2 + 2}" y="${yExpense}" width="${barWidth}" height="${hExpense}" rx="4" fill="#F43F5E" opacity="0.85" />
              <text x="${groupX + groupWidth / 2}" y="${svgHeight - 6}" text-anchor="middle" class="text-[10px] font-bold fill-slate-400">${d.month}</text>
            </g>
          `;
        }).join('');
      } else {
        // Line chart
        const generatePath = (key) => points.reduce((acc, pt, i) => {
          const y = key === 'income' ? pt.yIncome : pt.yExpense;
          return i === 0 ? `M ${pt.x},${y}` : `${acc} L ${pt.x},${y}`;
        }, '');

        const generateAreaPath = (key) => {
          const linePath = generatePath(key);
          const lastX = points[points.length - 1].x;
          const firstX = points[0].x;
          const bottomY = svgHeight - paddingY;
          return `${linePath} L ${lastX},${bottomY} L ${firstX},${bottomY} Z`;
        };

        chartContent = `
          <path d="${generateAreaPath('income')}" fill="url(#incomeGrad)" />
          <path d="${generateAreaPath('expense')}" fill="url(#expenseGrad)" />
          <path d="${generatePath('income')}" fill="none" stroke="#10B981" stroke-width="3" />
          <path d="${generatePath('expense')}" fill="none" stroke="#F43F5E" stroke-width="3" />
          ${points.map((pt, index) => `
            <g class="cursor-pointer" onclick="setActivePoint(${index})">
              <circle cx="${pt.x}" cy="${pt.yIncome}" r="4" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
              <circle cx="${pt.x}" cy="${pt.yExpense}" r="4" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2" />
              <text x="${pt.x}" y="${svgHeight - 6}" text-anchor="middle" class="text-[10px] font-bold fill-slate-400">${pt.month}</text>
            </g>
          `).join('')}
        `;
      }

      return `
        <div class="relative w-full overflow-x-auto no-scrollbar">
          ${state.activeTrendPoint !== null ? `
            <div class="absolute top-2 right-4 bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 px-3 py-1.5 rounded-xl text-xs shadow-lg flex items-center gap-3 z-10">
              <span class="font-bold">${data[state.activeTrendPoint].month}</span>
              <span class="text-emerald-400 dark:text-emerald-600 font-semibold">In: $${data[state.activeTrendPoint].income}</span>
              <span class="text-rose-400 dark:text-rose-600 font-semibold">Out: $${data[state.activeTrendPoint].expense}</span>
            </div>
          ` : ''}
          <svg class="w-full h-48 min-w-[380px]" viewBox="0 0 ${svgWidth} ${svgHeight}">
            <defs>
              <linearGradient id="incomeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
                <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
              </linearGradient>
              <linearGradient id="expenseGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.3" />
                <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0" />
              </linearGradient>
            </defs>
            ${gridLines}
            ${chartContent}
          </svg>
        </div>
      `;
    }

    function renderCategoryPieChart(data, isDark) {
      const total = data.reduce((acc, curr) => acc + curr.spent, 0);
      const radius = 40;
      const circumference = 2 * Math.PI * radius;
      let accumulatedOffset = 0;

      const slices = data.map((item, idx) => {
        const percentage = total > 0 ? item.spent / total : 0;
        const strokeDasharray = `${percentage * circumference} ${circumference}`;
        const strokeDashoffset = -accumulatedOffset;
        accumulatedOffset += percentage * circumference;
        const isHovered = state.hoveredCategoryIdx === idx;

        return `
          <circle
            cx="50"
            cy="50"
            r="${radius}"
            fill="transparent"
            stroke="${item.color}"
            stroke-width="${isHovered ? 14 : 10}"
            stroke-dasharray="${strokeDasharray}"
            stroke-dashoffset="${strokeDashoffset}"
            class="transition-all duration-300 cursor-pointer"
            onmouseenter="setHoveredCategory(${idx})"
            onmouseleave="setHoveredCategory(null)"
          />
        `;
      }).join('');

      const listItems = data.map((item, idx) => {
        const pct = total > 0 ? ((item.spent / total) * 100).toFixed(1) : 0;
        const isHovered = state.hoveredCategoryIdx === idx;
        return `
          <div
            onmouseenter="setHoveredCategory(${idx})"
            onmouseleave="setHoveredCategory(null)"
            class="p-2 rounded-xl flex items-center justify-between transition cursor-pointer text-xs ${
              isHovered 
                ? isDark ? 'bg-slate-700/80 shadow-md' : 'bg-slate-100 shadow-sm' 
                : 'hover:bg-slate-50 dark:hover:bg-slate-800/50'
            }"
          >
            <div class="flex items-center gap-2.5">
              <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${item.color}"></span>
              <span class="font-semibold text-slate-700 dark:text-slate-300">${item.category}</span>
            </div>
            <div class="text-right">
              <span class="font-bold text-slate-800 dark:text-slate-100">$${item.spent.toFixed(2)}</span>
              <span class="text-[10px] text-slate-400 block">${pct}%</span>
            </div>
          </div>
        `;
      }).join('');

      const activeCategory = state.hoveredCategoryIdx !== null ? data[state.hoveredCategoryIdx] : null;

      return `
        <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
          <div class="relative w-48 h-48 flex-shrink-0 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              ${slices}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center p-2">
              <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">
                ${activeCategory ? activeCategory.category : 'Total Spent'}
              </span>
              <span class="text-base font-extrabold tracking-tight">
                $${activeCategory ? activeCategory.spent.toFixed(2) : total.toFixed(2)}
              </span>
              ${activeCategory && total > 0 ? `
                <span class="text-[10px] font-semibold text-indigo-500">
                  ${((activeCategory.spent / total) * 100).toFixed(1)}% of total
                </span>
              ` : ''}
            </div>
          </div>
          <div class="w-full space-y-2.5">${listItems}</div>
        </div>
      `;
    }

    function setHoveredCategory(idx) {
      state.hoveredCategoryIdx = idx;
      render();
    }

    function setActivePoint(idx) {
      state.activeTrendPoint = state.activeTrendPoint === idx ? null : idx;
      render();
    }

    function handleDemoLogin() {
      const demoUser = {
        name: 'Alex Morgan',
        email: 'alex.m@university.edu',
        university: 'State University',
        allowance: '600',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
      };
      state.user = demoUser;
      localStorage.setItem('student_user', JSON.stringify(demoUser));
      showNotification('Logged in as Alex Morgan (Demo)');
      render();
    }

    function handleLogin(e) {
      e.preventDefault();
      if (!state.email || !state.password) {
        state.authError = 'Please fill in all credentials.';
        render();
        return;
      }
      const userData = {
        name: state.email.split('@')[0].toUpperCase(),
        email: state.email,
        university: state.university,
        allowance: state.monthlyAllowance,
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
      };
      state.user = userData;
      localStorage.setItem('student_user', JSON.stringify(userData));
      showNotification('Welcome back!');
      render();
    }

    function handleRegister(e) {
      e.preventDefault();
      if (!state.name || !state.email || !state.password) {
        state.authError = 'Please fill in all fields.';
        render();
        return;
      }
      const userData = {
        name: state.name,
        email: state.email,
        university: state.university,
        allowance: state.monthlyAllowance,
        avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80'
      };
      state.user = userData;
      localStorage.setItem('student_user', JSON.stringify(userData));
      showNotification('Account created successfully!');
      render();
    }

    function handleLogout() {
      state.user = null;
      state.email = '';
      state.password = '';
      state.authMode = 'login';
      localStorage.removeItem('student_user');
      showNotification('Successfully logged out.');
      render();
    }

    function handleAddTransaction(e) {
      e.preventDefault();
      const title = document.getElementById('new-title').value;
      const amount = parseFloat(document.getElementById('new-amount').value);
      const type = document.getElementById('new-type').value;
      const category = document.getElementById('new-category').value;

      if (!title || isNaN(amount) || amount <= 0) {
        showNotification('Please enter a valid title and positive amount.');
        return;
      }

      const item = {
        id: Date.now(),
        title,
        amount,
        type,
        category,
        date: new Date().toISOString().split('T')[0]
      };

      state.transactions.unshift(item);

      if (type === 'expense') {
        state.budgets = state.budgets.map(b => {
          if (b.category === category) {
            return { ...b, spent: b.spent + amount };
          }
          return b;
        });
      }

      state.isAddModalOpen = false;
      showNotification('Transaction added successfully!');
      render();
    }

    function handleDeleteTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      showNotification('Transaction removed.');
      render();
    }

    function handleSimulateScan(recipient, defaultAmt) {
      state.isScanning = true;
      render();
      setTimeout(() => {
        state.isScanning = false;
        state.qrRecipient = recipient;
        state.qrPayAmount = defaultAmt;
        showNotification(`QR Code detected: ${recipient}`);
        render();
      }, 1000);
    }

    function handleQrPayment(e) {
      e.preventDefault();
      const amt = parseFloat(state.qrPayAmount);
      if (!amt || isNaN(amt) || amt <= 0) {
        showNotification('Please enter a valid payment amount.');
        return;
      }

      const item = {
        id: Date.now(),
        title: `QR Pay: ${state.qrRecipient}`,
        amount: amt,
        type: 'expense',
        category: 'Food & Dining',
        date: new Date().toISOString().split('T')[0]
      };

      state.transactions.unshift(item);

      state.budgets = state.budgets.map(b => {
        if (b.category === 'Food & Dining') {
          return { ...b, spent: b.spent + amt };
        }
        return b;
      });

      state.qrSuccess = true;
      render();

      setTimeout(() => {
        state.qrSuccess = false;
        state.isQrModalOpen = false;
        state.qrPayAmount = '';
        state.qrPayNote = '';
        showNotification(`Successfully paid $${amt.toFixed(2)} to ${state.qrRecipient}!`);
        render();
      }, 1600);
    }

    function render() {
      const app = document.getElementById('app');
      const modalContainer = document.getElementById('modal-container');

      // Unauthenticated view
      if (!state.user) {
        app.innerHTML = `
          <header class="px-6 py-4 flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md">
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
              </div>
              <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                StudentMoney
              </span>
            </div>
            <button
              onclick="toggleDarkMode()"
              class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
            >
              <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="w-4 h-4 ${state.darkMode ? 'text-amber-400' : ''}"></i>
              <span class="hidden sm:inline">${state.darkMode ? 'Light Mode' : 'Dark Mode'}</span>
            </button>
          </header>

          <div class="flex-1 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 p-4 sm:p-6 lg:p-8 items-center gap-8">
            <div class="lg:col-span-6 space-y-6 hidden lg:flex flex-col justify-center pr-4">
              <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 w-fit">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Built Exclusively for College Students
              </div>

              <h1 class="text-4xl xl:text-5xl font-extrabold tracking-tight leading-tight">
                Master Your Student Budget with <span class="bg-gradient-to-r from-indigo-600 via-purple-600 to-violet-600 bg-clip-text text-transparent">Confidence.</span>
              </h1>

              <p class="text-slate-600 dark:text-slate-300 text-sm xl:text-base leading-relaxed">
                Track campus meal plans, textbooks, part-time stipends, and unlock interactive trending charts & student perks—all in one smart dashboard.
              </p>

              <div class="grid grid-cols-2 gap-4 pt-2">
                <div class="p-4 rounded-2xl border ${state.darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}">
                  <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center mb-2">
                    <i data-lucide="piggy-bank" class="w-4 h-4"></i>
                  </div>
                  <h3 class="font-bold text-xs">Smart Allowance Guard</h3>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Stay on budget without missing out on student life.</p>
                </div>

                <div class="p-4 rounded-2xl border ${state.darkMode ? 'bg-slate-800/60 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}">
                  <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-500 flex items-center justify-center mb-2">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                  </div>
                  <h3 class="font-bold text-xs">Visual Analytics</h3>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Interactive bar graphs & donut charts for instant insights.</p>
                </div>
              </div>

                          <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Share Link
                        </button>
                        <button
                          type="button"
                          onclick="showNotification('QR Code saved to photos!')"
                          class="px-3 py-2 rounded-xl border text-xs font-semibold ${state.darkMode ? 'border-slate-700 hover:bg-slate-800' : 'border-slate-200 hover:bg-slate-100'}"
                        >
                          <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  `}
                `}
              </div>
            </div>
          </div>
        `;
      }

      modalContainer.innerHTML = html;
    }

    // Initial App Render
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
